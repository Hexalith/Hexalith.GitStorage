openapi: 3.0.3
info:
  title: GitRepository API
  description: API for managing Git repositories within the Hexalith.GitStorage module
  version: 1.0.0
  contact:
    name: Hexalith Team

servers:
  - url: /api/GitStorage
    description: GitStorage API base path

tags:
  - name: GitRepository
    description: Git repository management operations
  - name: Events
    description: Event integration endpoints

paths:
  /repositories:
    get:
      tags:
        - GitRepository
      summary: Get repository summaries
      description: Returns a paginated list of repository summaries with optional search
      operationId: getGitRepositorySummaries
      parameters:
        - name: skip
          in: query
          description: Number of records to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: take
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search term to filter repositories
          schema:
            type: string
        - name: organizationId
          in: query
          description: Filter by organization ID
          schema:
            type: string
      responses:
        '200':
          description: List of repository summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositorySummaryListResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - GitRepository
      summary: Create a new repository
      description: Creates a new Git repository on the remote server and stores it locally
      operationId: addGitRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGitRepositoryRequest'
      responses:
        '202':
          description: Repository creation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400':
          description: Invalid request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Repository already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}:
    get:
      tags:
        - GitRepository
      summary: Get repository details
      description: Returns detailed information about a specific repository
      operationId: getGitRepositoryDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Repository ID (format {OrganizationId}-{RepositoryName})
          schema:
            type: string
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositoryDetailsResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/description:
    put:
      tags:
        - GitRepository
      summary: Update repository description
      description: Changes the description of an existing repository
      operationId: changeGitRepositoryDescription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDescriptionRequest'
      responses:
        '202':
          description: Description change accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/visibility:
    put:
      tags:
        - GitRepository
      summary: Change repository visibility
      description: Changes the visibility setting of a repository
      operationId: changeGitRepositoryVisibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeVisibilityRequest'
      responses:
        '202':
          description: Visibility change accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400':
          description: Invalid visibility value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/default-branch:
    put:
      tags:
        - GitRepository
      summary: Change default branch
      description: Changes the default branch of a repository
      operationId: changeGitRepositoryDefaultBranch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDefaultBranchRequest'
      responses:
        '202':
          description: Default branch change accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400':
          description: Invalid branch name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/disable:
    post:
      tags:
        - GitRepository
      summary: Disable repository
      description: Disables a repository locally (does not affect remote)
      operationId: disableGitRepository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Disable command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/enable:
    post:
      tags:
        - GitRepository
      summary: Enable repository
      description: Re-enables a disabled repository
      operationId: enableGitRepository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Enable command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repositories/{id}/sync:
    post:
      tags:
        - GitRepository
      summary: Sync repository
      description: Triggers bi-directional synchronization with the remote Git server
      operationId: syncGitRepository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Sync command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/GitRepository:
    post:
      tags:
        - Events
      summary: Process GitRepository events
      description: Dapr PubSub endpoint for processing GitRepository domain events
      operationId: processGitRepositoryEvents
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
      responses:
        '200':
          description: Event processed successfully
        '400':
          description: Invalid event format
        '500':
          description: Event processing failed

components:
  schemas:
    GitRepositoryVisibility:
      type: string
      enum:
        - Public
        - Private
        - Internal
      description: Repository visibility level

    GitRepositoryOrigin:
      type: string
      enum:
        - Synced
        - CreatedViaApplication
      description: How the repository was added to the system

    GitRepositorySyncStatus:
      type: string
      enum:
        - Synced
        - NotFoundOnRemote
        - SyncError
      description: Current synchronization status

    GitRepositorySummary:
      type: object
      required:
        - id
        - name
        - organizationId
        - visibility
        - syncStatus
        - disabled
      properties:
        id:
          type: string
          description: Repository ID
        name:
          type: string
          description: Repository name
        organizationId:
          type: string
          description: Parent organization ID
        visibility:
          $ref: '#/components/schemas/GitRepositoryVisibility'
        syncStatus:
          $ref: '#/components/schemas/GitRepositorySyncStatus'
        disabled:
          type: boolean
          description: Whether the repository is disabled

    GitRepositoryDetails:
      type: object
      required:
        - id
        - name
        - organizationId
        - visibility
        - origin
        - syncStatus
        - disabled
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          format: uri
        defaultBranch:
          type: string
          nullable: true
        organizationId:
          type: string
        organizationName:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/GitRepositoryVisibility'
        origin:
          $ref: '#/components/schemas/GitRepositoryOrigin'
        remoteId:
          type: string
          nullable: true
        syncStatus:
          $ref: '#/components/schemas/GitRepositorySyncStatus'
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        disabled:
          type: boolean

    GitRepositorySummaryListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GitRepositorySummary'
        total:
          type: integer
          description: Total count of matching repositories

    GitRepositoryDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/GitRepositoryDetails'

    AddGitRepositoryRequest:
      type: object
      required:
        - name
        - organizationId
        - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^(?!\.)(?!.*\.\.)[a-zA-Z0-9._-]{1,100}(?<!\.git)$'
          description: Repository name
        description:
          type: string
          nullable: true
          description: Optional repository description
        organizationId:
          type: string
          description: Parent organization ID
        visibility:
          $ref: '#/components/schemas/GitRepositoryVisibility'
        defaultBranch:
          type: string
          default: main
          description: Default branch name

    ChangeDescriptionRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: New description (null to clear)

    ChangeVisibilityRequest:
      type: object
      required:
        - visibility
      properties:
        visibility:
          $ref: '#/components/schemas/GitRepositoryVisibility'

    ChangeDefaultBranchRequest:
      type: object
      required:
        - defaultBranch
      properties:
        defaultBranch:
          type: string
          minLength: 1
          description: New default branch name

    CommandAcceptedResponse:
      type: object
      required:
        - aggregateId
        - commandId
      properties:
        aggregateId:
          type: string
          description: The aggregate ID the command was applied to
        commandId:
          type: string
          format: uuid
          description: Unique identifier for tracking the command

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: string
          description: Additional error details

    CloudEvent:
      type: object
      description: CloudEvents envelope for Dapr PubSub
      required:
        - type
        - source
        - data
      properties:
        type:
          type: string
        source:
          type: string
        data:
          type: object
